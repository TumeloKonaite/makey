[project]
name = "beautyverse-marketplace"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "clerk-backend-api>=6.0.0,<7.0.0",
    "fastapi>=0.137.1",
    "modal",
    "minio>=7.2.12",
    "psycopg[binary]>=3.2.3",
    "pydantic-settings>=2.7.1",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.36",
    "svix>=1.82.0,<2.0.0",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.13,<0.14",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"] # FastAPI intentionally declares dependencies in defaults.

[tool.ruff.format]
quote-style = "double"
