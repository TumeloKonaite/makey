            )"

            grep -Fqi "access-control-allow-origin: ${origin}" \
              <<<"${cors_headers}" || {
              echo "::error::Production frontend origin was not allowed by CORS: ${origin}"
              exit 1
            }

            grep -Fqi "access-control-allow-credentials: true" \
              <<<"${cors_headers}" || {
              echo "::error::Credentialed CORS was not enabled for: ${origin}"
              exit 1
            }
          done

          unauthorized_origin="https://unauthorized.invalid"
          unauthorized_headers="$(
            curl \
              --silent \
              --show-error \
              --dump-header - \
              --output /dev/null \
              --request OPTIONS \
              --header "Origin: ${unauthorized_origin}" \
              --header 'Access-Control-Request-Method: GET' \
              --header 'Access-Control-Request-Headers: Authorization,Content-Type' \
              --proto '=https' \
              --tlsv1.2 \
              "https://${fqdn}/categories" |
              tr -d '\r'
          )"

          if grep -Fqi \
            "access-control-allow-origin: ${unauthorized_origin}" \
            <<<"${unauthorized_headers}"; then
            echo "::error::Unauthorized origin was unexpectedly allowed by CORS"
            exit 1
          fi


          {
            echo "### Production deployment"
            echo
            echo "- Image: \`${EXPECTED_IMAGE}\`"
            echo "- Container App: \`${{ vars.CONTAINER_APP_NAME }}\`"
            echo "- Resource group: \`${{ vars.AZURE_RESOURCE_GROUP }}\`"
            echo "- Digest: \`${EXPECTED_DIGEST}\`"
            echo "- Previous revision: \`${PREVIOUS_REVISION:-<none>}\`"
            echo "- New revision: \`${new_revision}\`"
            echo "- Health URL: https://${fqdn}/health"
            echo "- Ready URL: https://${fqdn}/ready"
            echo "- Deployment URL: https://${fqdn}"
            echo "- HTTPS/TLS and public /health: passed"
            echo "- /ready dependencies: passed"
            echo "- PostgreSQL-backed GET /categories: passed"
            echo "- CORS for all configured frontend origins: passed"
            echo "- Immutable deployed image and digest: passed"
            echo "- Registry authentication: user-assigned managed identity"
            echo "- ACR role: AcrPull"
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Roll back failed application release
        id: rollback
        if: >-
          always() && env.PREVIOUS_IMAGE != '' &&
          (steps.apply.outcome == 'failure' || (steps.apply.outcome == 'success' && steps.smoke.outcome != 'success'))
        continue-on-error: true
        shell: bash
        env:
          TF_VAR_container_image: ${{ env.PREVIOUS_IMAGE }}
        run: |
          set -euo pipefail
          # Production migrations follow the documented expand-and-contract policy;
          # the previous API must remain compatible with the migrated schema.
          tf_dir="infrastructure/environments/production"
          terraform -chdir="${tf_dir}" plan -input=false \
            -target='module.rooms_backend.azurerm_container_app.this' \
            -out=rollback.tfplan
          terraform -chdir="${tf_dir}" apply -input=false -auto-approve rollback.tfplan

          app_json="$(az containerapp show --name "${{ vars.CONTAINER_APP_NAME }}" --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --output json)"
          rollback_image="$(jq -r '.properties.template.containers[0].image' <<<"${app_json}")"
          rollback_revision="$(jq -r '.properties.latestReadyRevisionName // empty' <<<"${app_json}")"
          fqdn="$(jq -r '.properties.configuration.ingress.fqdn' <<<"${app_json}")"
          [[ "${rollback_image}" == "${PREVIOUS_IMAGE}" ]] || { echo "::error::Rollback deployed an unexpected image"; exit 1; }
          [[ -n "${rollback_revision}" && -n "${fqdn}" ]] || { echo "::error::Rollback has no ready revision or FQDN"; exit 1; }

          health="$(curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 10 --proto '=https' --tlsv1.2 "https://${fqdn}/health")"
          jq -e '.status == "ok"' <<<"${health}" >/dev/null
          ready="$(curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 10 --proto '=https' --tlsv1.2 "https://${fqdn}/ready")"
          jq -e '.status == "ok" and .checks.database == "ok"' <<<"${ready}" >/dev/null
          categories="$(curl --fail --silent --show-error --proto '=https' --tlsv1.2 "https://${fqdn}/categories")"
          jq -e 'type == "array"' <<<"${categories}" >/dev/null
          {
            echo "### Automatic application rollback"
            echo
            echo "- Result: succeeded"
            echo "- Restored image: \`${rollback_image}\`"
            echo "- Restored revision: \`${rollback_revision}\`"
            echo "- /health, /ready, and PostgreSQL-backed GET /categories: passed"
            echo "- Database downgrade: not attempted"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Finalize deployment result
        if: always()
        shell: bash
        env:
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          ROLLBACK_OUTCOME: ${{ steps.rollback.outcome }}
        run: |
          set -euo pipefail
          {
            echo "### Release result"
            echo
            echo "- Commit: \`${{ steps.image.outputs.sha }}\`"
            echo "- Terraform plan: \`${{ steps.plan.outcome }}\`"
            echo "- Terraform apply: \`${APPLY_OUTCOME}\`"
            echo "- Migration job/execution: \`${{ steps.migration.outputs.job_name }}\` / \`${{ steps.migration.outputs.execution_name }}\`"
            echo "- Smoke tests: \`${SMOKE_OUTCOME}\`"
            echo "- Rollback: \`${ROLLBACK_OUTCOME}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [[ "${APPLY_OUTCOME}" != "success" || "${SMOKE_OUTCOME}" != "success" ]]; then
            if [[ "${APPLY_OUTCOME}" == "skipped" ]]; then
              echo "::error::Release stopped before application deployment; the current production application was unchanged"
            elif [[ -z "${PREVIOUS_IMAGE}" ]]; then
              echo "::error::Release failed and no previous immutable release exists; manual intervention is required"
            elif [[ "${ROLLBACK_OUTCOME}" != "success" ]]; then