name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      image_sha:
        description: Existing 40-character ACR image SHA to roll back to; leave empty to build this commit
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Publish and deploy Azure backend

    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.conclusion == 'success'
      )

    runs-on: ubuntu-latest
    timeout-minutes: 60

    environment: production

    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_USE_CLI: "false"

      ACR_NAME: ${{ vars.ACR_NAME }}
      ACR_REPOSITORY: rooms-api

      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_location: ${{ vars.AZURE_LOCATION }}
      TF_VAR_resource_group_name: ${{ vars.AZURE_RESOURCE_GROUP }}

      TF_VAR_container_registry_name: ${{ vars.ACR_NAME }}

      TF_VAR_log_analytics_workspace_name: ${{ vars.LOG_ANALYTICS_WORKSPACE_NAME }}
      TF_VAR_container_app_environment_name: ${{ vars.CONTAINER_APP_ENVIRONMENT_NAME }}
      TF_VAR_container_app_name: ${{ vars.CONTAINER_APP_NAME }}

      TF_VAR_frontend_origin: ${{ vars.FRONTEND_ORIGIN }}

      TF_VAR_postgresql_resource_group_name: ${{ vars.POSTGRESQL_RESOURCE_GROUP_NAME }}
      TF_VAR_postgresql_server_name: ${{ vars.POSTGRESQL_SERVER_NAME }}
      TF_VAR_postgresql_database_name: ${{ vars.POSTGRESQL_DATABASE_NAME }}

      TF_VAR_database_url: ${{ secrets.TF_VAR_DATABASE_URL }}
      TF_VAR_clerk_secret_key: ${{ secrets.TF_VAR_CLERK_SECRET_KEY }}
      TF_VAR_clerk_webhook_secret: ${{ secrets.TF_VAR_CLERK_WEBHOOK_SECRET }}

      TF_VAR_object_storage_access_key: ${{ secrets.OBJECT_STORAGE_ACCESS_KEY }}
      TF_VAR_object_storage_secret_key: ${{ secrets.OBJECT_STORAGE_SECRET_KEY }}
      TF_VAR_environment_variables: ${{ vars.TF_VAR_ENVIRONMENT_VARIABLES }}

    steps:
      - name: Resolve immutable deployment SHA
        id: image
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.image_sha }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [[ -n "${REQUESTED_SHA}" ]]; then
            image_sha="${REQUESTED_SHA}"
            build=false
          elif [[ -n "${VALIDATED_SHA}" ]]; then
            image_sha="${VALIDATED_SHA}"
            build=true
          else
            image_sha="${GITHUB_SHA}"
            build=true
          fi

          [[ "${image_sha}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Deployment image tag must be a full lowercase Git SHA"
            exit 1
          }

          echo "sha=${image_sha}" >> "${GITHUB_OUTPUT}"
          echo "build=${build}" >> "${GITHUB_OUTPUT}"

      - name: Check out validated revision
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.image.outputs.build == 'true' && steps.image.outputs.sha || github.sha }}

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure context
        shell: bash
        run: |
          set -euo pipefail
          az account show \
            --query '{subscription:id,tenant:tenantId}' \
            --output json

      - name: Record current production release
        id: previous
        shell: bash
        run: |
          set -euo pipefail
          app_json="$(az containerapp show --name "${{ vars.CONTAINER_APP_NAME }}" --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --output json 2>/dev/null || true)"
          [[ -n "${app_json}" ]] || app_json='{}'
          previous_image="$(jq -r '.properties.template.containers[0].image // empty' <<<"${app_json}")"
          previous_revision="$(jq -r '.properties.latestReadyRevisionName // empty' <<<"${app_json}")"
          previous_sha="${previous_image##*:}"

          if [[ -n "${previous_image}" ]]; then
            [[ "${previous_sha}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Current production image is not an immutable Git SHA tag"; exit 1; }
            az acr repository show --name "${ACR_NAME}" --image "${ACR_REPOSITORY}:${previous_sha}" --only-show-errors >/dev/null
          fi

          {
            echo "PREVIOUS_IMAGE=${previous_image}"
            echo "PREVIOUS_REVISION=${previous_revision}"
            echo "PREVIOUS_SHA=${previous_sha}"
          } >> "${GITHUB_ENV}"
          {
            echo "### Previous production release"
            echo
            echo "- Image: \`${previous_image:-<initial deployment>}\`"
            echo "- Revision: \`${previous_revision:-<none>}\`"
            echo "- Rollback image retained in ACR: $([[ -n "${previous_image}" ]] && echo yes || echo not-applicable)"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Build and publish immutable image
        if: steps.image.outputs.build == 'true'
        shell: bash
        env:
          IMAGE_SHA: ${{ steps.image.outputs.sha }}
        run: |
          set -euo pipefail

          az acr login --name "${ACR_NAME}"

          image="${ACR_NAME}.azurecr.io/${ACR_REPOSITORY}:${IMAGE_SHA}"
          if az acr repository show --name "${ACR_NAME}" --image "${ACR_REPOSITORY}:${IMAGE_SHA}" --only-show-errors >/dev/null 2>&1; then
            echo "Immutable SHA tag already exists; preserving the published manifest."
          else
            docker build \
              --pull \
              --tag "${image}" \
              ./backend

            docker push "${image}"
          fi

      - name: Confirm rollback image exists
        if: steps.image.outputs.build != 'true'
        shell: bash
        env:
          IMAGE_SHA: ${{ steps.image.outputs.sha }}
        run: |
          set -euo pipefail

          az acr repository show \
            --name "${ACR_NAME}" \
            --image "${ACR_REPOSITORY}:${IMAGE_SHA}" \
            --only-show-errors \
            >/dev/null

      - name: Resolve published image digest
        id: published
        shell: bash
        env:
          IMAGE_SHA: ${{ steps.image.outputs.sha }}
        run: |
          set -euo pipefail
          image="${ACR_NAME}.azurecr.io/${ACR_REPOSITORY}:${IMAGE_SHA}"
          digest="$(az acr repository show --name "${ACR_NAME}" --image "${ACR_REPOSITORY}:${IMAGE_SHA}" --query digest --output tsv --only-show-errors)"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::ACR did not return a valid immutable digest"; exit 1; }
          digest_image="${ACR_NAME}.azurecr.io/${ACR_REPOSITORY}@${digest}"
          {
            echo "image=${image}"
            echo "digest=${digest}"
            echo "digest_image=${digest_image}"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "### Release image"
            echo
            echo "- Git commit: \`${IMAGE_SHA}\`"
            echo "- SHA-tagged image: \`${image}\`"
            echo "- Digest: \`${digest}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Expose GitHub OIDC request to Terraform
        shell: bash
        run: |
          set -euo pipefail

          [[ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]
          [[ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]

          {
            printf 'ARM_OIDC_REQUEST_URL=%s\n' "${ACTIONS_ID_TOKEN_REQUEST_URL}"
            printf 'ARM_OIDC_REQUEST_TOKEN=%s\n' "${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"
          } >> "${GITHUB_ENV}"

      - name: Initialize production state
        shell: bash
        run: |
          set -euo pipefail

          terraform \
            -chdir=infrastructure/environments/production \
            init \
            -reconfigure \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="client_id=${ARM_CLIENT_ID}" \
            -backend-config="tenant_id=${ARM_TENANT_ID}" \
            -backend-config="subscription_id=${ARM_SUBSCRIPTION_ID}" \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate"

      - name: Validate production Terraform
        shell: bash
        run: |
          set -euo pipefail

          terraform \
            -chdir=infrastructure/environments/production \
            validate

      - name: Provision migration job
        shell: bash
        env:
          TF_VAR_container_image: ${{ env.ACR_NAME }}.azurecr.io/${{ env.ACR_REPOSITORY }}:${{ steps.image.outputs.sha }}
        run: |
          set -euo pipefail
          tf_dir="infrastructure/environments/production"
          terraform -chdir="${tf_dir}" plan -input=false \
            -target='module.rooms_backend.azurerm_user_assigned_identity.acr_pull[0]' \
            -target='module.rooms_backend.azurerm_role_assignment.acr_pull[0]' \
            -target='azurerm_postgresql_flexible_server_configuration.postgis' \
            -target='module.rooms_backend.azurerm_container_app_job.migrations[0]' \
            -out=migration.tfplan
          terraform -chdir="${tf_dir}" apply -input=false -auto-approve migration.tfplan

      - name: Run and verify database migration
        id: migration
        shell: bash
        run: |
          set -euo pipefail
          job_name="$(terraform -chdir=infrastructure/environments/production output -raw migration_job_name)"
          execution_name="$(az containerapp job start --name "${job_name}" --resource-group "${TF_VAR_resource_group_name}" --query name --output tsv)"
          [[ -n "${execution_name}" ]] || { echo "::error::Azure did not return a migration execution name"; exit 1; }
          echo "job_name=${job_name}" >> "${GITHUB_OUTPUT}"
          echo "execution_name=${execution_name}" >> "${GITHUB_OUTPUT}"

          for _ in {1..90}; do
            status="$(az containerapp job execution show \
              --name "${job_name}" \
              --resource-group "${TF_VAR_resource_group_name}" \
              --job-execution-name "${execution_name}" \
              --query properties.status --output tsv)"
            case "${status}" in
              Succeeded) echo "Migration and revision verification ${execution_name} succeeded"; break ;;
              Failed|Stopped|Degraded) echo "::error::Migration or revision verification ${execution_name} ended with ${status}"; exit 1 ;;
            esac
            sleep 10
          done
          [[ "${status}" == "Succeeded" ]] || { echo "::error::Migration timed out with status ${status}"; exit 1; }

          {
            echo "### Database migration"
            echo
            echo "- Job: \`${job_name}\`"
            echo "- Upgrade and revision verification execution: \`${execution_name}\` (Succeeded)"
            echo "- Result: database revision matches the image's single Alembic head"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Plan production revision
        id: plan
        shell: bash
        env:
          TF_VAR_container_image: ${{ env.ACR_NAME }}.azurecr.io/${{ env.ACR_REPOSITORY }}:${{ steps.image.outputs.sha }}
        run: |
          set -euo pipefail
          terraform -chdir=infrastructure/environments/production plan -input=false -out=production.tfplan

          terraform -chdir=infrastructure/environments/production show -json production.tfplan \
            | jq -r '[.resource_changes[]?.change.actions | join("/")] | group_by(.) | map({action: .[0], count: length}) | "| Action | Resources |\n|---|---:|\n" + (map("| `\(.action)` | \(.count) |") | join("\n"))' \
            > /tmp/plan-summary.md
          {
            echo "### Terraform production plan"
            echo
            cat /tmp/plan-summary.md
            echo
            echo "The saved plan is kept only on this runner and applied unchanged; it is not uploaded because plan files may contain secrets."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Apply production revision
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=infrastructure/environments/production apply -input=false -auto-approve production.tfplan
          {
            echo "### Terraform apply"
            echo
            echo "- Result: succeeded using the exact saved plan"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Refresh Azure OIDC session
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify identity, image, and deployed revision
        id: smoke
        if: steps.apply.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          EXPECTED_IMAGE: ${{ env.ACR_NAME }}.azurecr.io/${{ env.ACR_REPOSITORY }}:${{ steps.image.outputs.sha }}
          EXPECTED_DIGEST: ${{ steps.published.outputs.digest }}
          FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
        run: |
          set -euo pipefail

          app_json="$(
            az containerapp show \
              --name "${{ vars.CONTAINER_APP_NAME }}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --output json
          )"

          actual_image="$(
            jq -r '.properties.template.containers[0].image' \
              <<<"${app_json}"
          )"

          [[ "${actual_image}" == "${EXPECTED_IMAGE}" ]] || {
            echo "::error::Unexpected deployed image"
            echo "Expected: ${EXPECTED_IMAGE}"
            echo "Actual:   ${actual_image}"
            exit 1
          }

          actual_digest="$(az acr repository show \
            --name "${ACR_NAME}" \
            --image "${ACR_REPOSITORY}:${{ steps.image.outputs.sha }}" \
            --query digest --output tsv --only-show-errors)"
          [[ "${actual_digest}" == "${EXPECTED_DIGEST}" ]] || {
            echo "::error::Deployed SHA tag no longer resolves to the published digest"
            exit 1
          }
          new_revision="$(jq -r '.properties.latestReadyRevisionName // empty' <<<"${app_json}")"
          [[ -n "${new_revision}" ]] || { echo "::error::No ready production revision was reported"; exit 1; }

          principal_id="$(
            jq -r '.identity.principalId' \
              <<<"${app_json}"
          )"

          registry_identity="$(
            jq -r '.properties.configuration.registries[0].identity // empty' \
              <<<"${app_json}"
          )"

          registry_username="$(
            jq -r '.properties.configuration.registries[0].username // empty' \
              <<<"${app_json}"
          )"

          registry_password_ref="$(
            jq -r '.properties.configuration.registries[0].passwordSecretRef // empty' \
              <<<"${app_json}"
          )"

          [[ -n "${principal_id}" && "${principal_id}" != "null" ]] || {
            echo "::error::Container App system-assigned identity is missing"
            exit 1
          }

          [[ "${registry_identity}" == /subscriptions/*/resourceGroups/*/providers/Microsoft.ManagedIdentity/userAssignedIdentities/* ]] || {
            echo "::error::ACR authentication is not configured with a user-assigned identity"
            exit 1
          }

          [[ -z "${registry_username}" && -z "${registry_password_ref}" ]] || {
            echo "::error::Registry username/password authentication is unexpectedly configured"
            exit 1
          }

          acr_id="$(
            az acr show \
              --name "${ACR_NAME}" \
              --query id \
              --output tsv
          )"

          admin_enabled="$(
            az acr show \
              --name "${ACR_NAME}" \
              --query adminUserEnabled \
              --output tsv
          )"

          [[ "${admin_enabled,,}" == "false" ]] || {
            echo "::error::ACR admin user must remain disabled"
            exit 1
          }

          acr_pull_principal_id="$(
            az identity show --ids "${registry_identity}" --query principalId --output tsv
          )"
          [[ -n "${acr_pull_principal_id}" ]] || {
            echo "::error::ACR pull identity principal is missing"
            exit 1
          }

          assignments="$(
            az role assignment list \
              --assignee-object-id "${acr_pull_principal_id}" \
              --all \
              --query '[].{role:roleDefinitionName,scope:scope}' \
              --output json
          )"

          acr_pull_count="$(
            jq \
              --arg acr_id "${acr_id,,}" \
              '[.
                []
                | select(
                    .role == "AcrPull" and
                    (.scope | ascii_downcase) == $acr_id
                  )
              ]
              | length' \
              <<<"${assignments}"
          )"

          [[ "${acr_pull_count}" -eq 1 ]] || {
            echo "::error::Expected exactly one AcrPull assignment on the ACR"
            echo "${assignments}"
            exit 1
          }

          fqdn="$(
            jq -r '.properties.configuration.ingress.fqdn' \
              <<<"${app_json}"
          )"

          [[ -n "${fqdn}" && "${fqdn}" != "null" ]] || {
            echo "::error::Container App ingress FQDN is missing"
            exit 1
          }

          curl \
            --fail \
            --show-error \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 10 \
            "https://${fqdn}/health"

          curl \
            --fail \
            --show-error \
            --retry 6 \
            --retry-all-errors \
            --retry-delay 10 \
            "https://${fqdn}/ready"
          health="$(curl --fail --silent --show-error --proto '=https' --tlsv1.2 "https://${fqdn}/health")"
          jq -e '.status == "ok"' <<<"${health}" >/dev/null
          ready="$(curl --fail --silent --show-error --proto '=https' --tlsv1.2 "https://${fqdn}/ready")"
          jq -e '.status == "ok" and .checks.database == "ok" and .checks.object_storage == "ok"' <<<"${ready}" >/dev/null
          categories="$(curl --fail --silent --show-error --proto '=https' --tlsv1.2 "https://${fqdn}/categories")"
          jq -e 'type == "array"' <<<"${categories}" >/dev/null

          IFS=',' read -ra frontend_origins <<<"${FRONTEND_ORIGIN}"
          [[ "${#frontend_origins[@]}" -gt 0 ]] || {
            echo "::error::No production frontend origins were configured"
            exit 1
          }

          for configured_origin in "${frontend_origins[@]}"; do
            origin="$(xargs <<<"${configured_origin}")"

            [[ -n "${origin}" ]] || {
              echo "::error::An empty production frontend origin was configured"
              exit 1
            }

            cors_headers="$(
              curl \
                --fail \
                --silent \
                --show-error \
                --dump-header - \
                --output /dev/null \
                --request OPTIONS \
                --header "Origin: ${origin}" \
                --header 'Access-Control-Request-Method: GET' \
                --header 'Access-Control-Request-Headers: Authorization,Content-Type' \
                --proto '=https' \
                --tlsv1.2 \
                "https://${fqdn}/categories" |
                tr -d '\r'
            )"

            grep -Fqi "access-control-allow-origin: ${origin}" \
              <<<"${cors_headers}" || {
              echo "::error::Production frontend origin was not allowed by CORS: ${origin}"
              exit 1
            }

            grep -Fqi "access-control-allow-credentials: true" \
              <<<"${cors_headers}" || {
              echo "::error::Credentialed CORS was not enabled for: ${origin}"
              exit 1
            }
          done

          unauthorized_origin="https://unauthorized.invalid"
          unauthorized_headers="$(
            curl \
              --silent \
              --show-error \
              --dump-header - \
              --output /dev/null \
              --request OPTIONS \
              --header "Origin: ${unauthorized_origin}" \
              --header 'Access-Control-Request-Method: GET' \
              --header 'Access-Control-Request-Headers: Authorization,Content-Type' \
              --proto '=https' \
              --tlsv1.2 \
              "https://${fqdn}/categories" |
              tr -d '\r'
          )"

          if grep -Fqi \
            "access-control-allow-origin: ${unauthorized_origin}" \
            <<<"${unauthorized_headers}"; then
            echo "::error::Unauthorized origin was unexpectedly allowed by CORS"
            exit 1
          fi


          {
            echo "### Production deployment"
            echo
            echo "- Image: \`${EXPECTED_IMAGE}\`"
            echo "- Container App: \`${{ vars.CONTAINER_APP_NAME }}\`"
            echo "- Resource group: \`${{ vars.AZURE_RESOURCE_GROUP }}\`"
            echo "- Digest: \`${EXPECTED_DIGEST}\`"
            echo "- Previous revision: \`${PREVIOUS_REVISION:-<none>}\`"
            echo "- New revision: \`${new_revision}\`"
            echo "- Health URL: https://${fqdn}/health"
            echo "- Ready URL: https://${fqdn}/ready"
            echo "- Deployment URL: https://${fqdn}"
            echo "- HTTPS/TLS and public /health: passed"
            echo "- /ready dependencies: passed"
            echo "- PostgreSQL-backed GET /categories: passed"
            echo "- CORS for all configured frontend origins: passed"
            echo "- Immutable deployed image and digest: passed"
            echo "- Registry authentication: user-assigned managed identity"
            echo "- ACR role: AcrPull"
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Roll back failed application release
        id: rollback
        if: >-
          always() && env.PREVIOUS_IMAGE != '' &&
          (steps.apply.outcome == 'failure' || (steps.apply.outcome == 'success' && steps.smoke.outcome != 'success'))
        continue-on-error: true
        shell: bash
        env:
          TF_VAR_container_image: ${{ env.PREVIOUS_IMAGE }}
        run: |
          set -euo pipefail
          # Production migrations follow the documented expand-and-contract policy;
          # the previous API must remain compatible with the migrated schema.
          tf_dir="infrastructure/environments/production"
          terraform -chdir="${tf_dir}" plan -input=false \
            -target='module.rooms_backend.azurerm_container_app.this' \
            -out=rollback.tfplan
          terraform -chdir="${tf_dir}" apply -input=false -auto-approve rollback.tfplan

          app_json="$(az containerapp show --name "${{ vars.CONTAINER_APP_NAME }}" --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --output json)"
          rollback_image="$(jq -r '.properties.template.containers[0].image' <<<"${app_json}")"
          rollback_revision="$(jq -r '.properties.latestReadyRevisionName // empty' <<<"${app_json}")"
          fqdn="$(jq -r '.properties.configuration.ingress.fqdn' <<<"${app_json}")"
          [[ "${rollback_image}" == "${PREVIOUS_IMAGE}" ]] || { echo "::error::Rollback deployed an unexpected image"; exit 1; }
          [[ -n "${rollback_revision}" && -n "${fqdn}" ]] || { echo "::error::Rollback has no ready revision or FQDN"; exit 1; }

          health="$(curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 10 --proto '=https' --tlsv1.2 "https://${fqdn}/health")"
          jq -e '.status == "ok"' <<<"${health}" >/dev/null
          ready="$(curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 10 --proto '=https' --tlsv1.2 "https://${fqdn}/ready")"
          jq -e '.status == "ok" and .checks.database == "ok"' <<<"${ready}" >/dev/null
          categories="$(curl --fail --silent --show-error --proto '=https' --tlsv1.2 "https://${fqdn}/categories")"
          jq -e 'type == "array"' <<<"${categories}" >/dev/null
          {
            echo "### Automatic application rollback"
            echo
            echo "- Result: succeeded"
            echo "- Restored image: \`${rollback_image}\`"
            echo "- Restored revision: \`${rollback_revision}\`"
            echo "- /health, /ready, and PostgreSQL-backed GET /categories: passed"
            echo "- Database downgrade: not attempted"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Finalize deployment result
        if: always()
        shell: bash
        env:
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          ROLLBACK_OUTCOME: ${{ steps.rollback.outcome }}
        run: |
          set -euo pipefail
          {
            echo "### Release result"
            echo
            echo "- Commit: \`${{ steps.image.outputs.sha }}\`"
            echo "- Terraform plan: \`${{ steps.plan.outcome }}\`"
            echo "- Terraform apply: \`${APPLY_OUTCOME}\`"
            echo "- Migration job/execution: \`${{ steps.migration.outputs.job_name }}\` / \`${{ steps.migration.outputs.execution_name }}\`"
            echo "- Smoke tests: \`${SMOKE_OUTCOME}\`"
            echo "- Rollback: \`${ROLLBACK_OUTCOME}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [[ "${APPLY_OUTCOME}" != "success" || "${SMOKE_OUTCOME}" != "success" ]]; then
            if [[ "${APPLY_OUTCOME}" == "skipped" ]]; then
              echo "::error::Release stopped before application deployment; the current production application was unchanged"
            elif [[ -z "${PREVIOUS_IMAGE}" ]]; then
              echo "::error::Release failed and no previous immutable release exists; manual intervention is required"
            elif [[ "${ROLLBACK_OUTCOME}" != "success" ]]; then
              echo "::error::Release and automatic application rollback failed; manual intervention is required"
            else
              echo "::error::Release validation failed; the previous application image was restored successfully"
            fi
            exit 1
          fi
