name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infrastructure/

      - name: Initialize local Terraform root
        run: terraform -chdir=infrastructure/environments/local init -backend=false

      - name: Validate local Terraform root
        run: terraform -chdir=infrastructure/environments/local validate

      - name: Initialize production Terraform root
        run: terraform -chdir=infrastructure/environments/production init -backend=false

      - name: Validate production Terraform root
        run: terraform -chdir=infrastructure/environments/production validate

  backend:
    name: Backend quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint backend
        run: make lint

      - name: Verify backend formatting
        run: make format-check

      - name: Run backend tests
        run: make test

  production-container:
    name: Production container validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build production backend image
        run: docker build --tag rooms-api:ci ./backend

      - name: Start and validate production backend image
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker run --detach --publish 127.0.0.1::8000 --env APP_ENV=test rooms-api:ci)"
          cleanup() {
            docker logs "${container_id}" || true
            docker rm --force "${container_id}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          host_port="$(docker port "${container_id}" 8000/tcp | awk -F: '{print $NF}')"
          [[ -n "${host_port}" ]] || { echo "::error::Container did not publish port 8000"; exit 1; }

          status=starting
          for _ in {1..30}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' "${container_id}")"
            case "${status}" in
              healthy) break ;;
              unhealthy) echo "::error::Container became unhealthy"; exit 1 ;;
            esac
            sleep 2
          done
          [[ "${status}" == "healthy" ]] || { echo "::error::Container health check timed out"; exit 1; }

          response="$(curl --fail --silent --show-error "http://127.0.0.1:${host_port}/health")"
          jq -e '.status == "ok"' <<<"${response}" >/dev/null

      - name: Print container diagnostics on failure
        if: failure()
        run: docker ps --all && docker logs "$(docker ps --all --quiet --filter ancestor=rooms-api:ci | head -n1)" || true

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: RoomWise Marketplace
    env:
      VITE_API_BASE_URL: https://api.example.com
      VITE_CLERK_PUBLISHABLE_KEY: pk_test_replace_me
      CLERK_SECRET_KEY: sk_test_replace_me
      CLERK_SIGN_IN_URL: /login
      CLERK_SIGN_UP_URL: /sign-up

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: RoomWise Marketplace/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check frontend
        run: npm run typecheck

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Verify generated route tree is committed
        run: git diff --exit-code -- src/routeTree.gen.ts
